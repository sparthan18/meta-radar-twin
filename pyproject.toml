[project]
name = "radartwin"
version = "0.1.0"
description = "City-scale radar watchlist for infrastructure"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "shapely",
    "pyproj",
    "pystac-client",
    "planetary-computer",
    "rasterio",
    "httpx",
    "pydantic",
    "pydantic-ai-slim[typesafe,openai]",
    "typesafe-sdk==0.6.0",
    "python-dotenv",
    "matplotlib",
    "openai",
    "meta-sam-parser>=0.1.0",
]

[project.optional-dependencies]
full = ["modal"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radartwin"]
